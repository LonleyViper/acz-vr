<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Provisional __MODEL_NAME__ cockpit preview</title>
<style>body{margin:0;background:#151a1e;color:#eef3f4;font:14px system-ui}header{padding:12px 16px;line-height:1.6}canvas{display:block;width:100%;height:calc(100vh - 100px);background:#242b31;touch-action:none}button{margin-right:8px}</style></head>
<body><header><strong>Provisional __MODEL_NAME__ geometry</strong> — triangle-strip and texture binding assumptions are unverified.<br>
Drag to orbit, wheel to zoom, click to inspect a candidate batch. <button id="front">Front</button><button id="down">Look down</button><button id="toggle">Show full model</button><button id="hud">Show mock instruments</button><button id="alpha">Show opaque atlas</button><button id="nearby">Hide nearby geometry</button><br><span id="status">Loading…</span><br><span id="selection">No batch selected.</span></header><canvas id="view"></canvas>
<script>
"use strict";
// Embedded locally by export_itesu_preview.py; no external scripts or requests.
const model = __MODEL_JSON__;
const viewOptions = __VIEW_OPTIONS__;
const texture = new Image(); texture.src = __TEXTURE_URL__;
const opaqueTexture = new Image(); opaqueTexture.src = __OPAQUE_URL__;
const hud = new Image(), hudUrl = __HUD_URL__; if(hudUrl) hud.src=hudUrl;
const canvas=document.getElementById('view'), ctx=canvas.getContext('2d');
let yaw=Math.PI, pitch=0.15, distance=3, target=viewOptions.target, dragging=false, px=0, py=0, startX=0, startY=0, moved=false, panelOnly=true, useHud=!!hudUrl && new URLSearchParams(location.search).has('mock'), forceOpaque=new URLSearchParams(location.search).has('opaque'), hideNearby=new URLSearchParams(location.search).has('hide'), visibleTriangles=[], selectedOffset=null, pickPixels=null;
if(new URLSearchParams(location.search).has('down')) pitch=0.7;
let pendingPick=new URLSearchParams(location.search).get('pick');
const sub=(a,b)=>a.map((v,i)=>v-b[i]);
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const unit=a=>{let n=Math.hypot(...a);return a.map(x=>x/n)};
function render(){
  if(!texture.complete || !texture.naturalWidth)return;
  if(forceOpaque && (!opaqueTexture.complete || !opaqueTexture.naturalWidth))return;
  let atlas=forceOpaque?opaqueTexture:texture;
  if(forceOpaque){
    atlas=document.createElement('canvas');atlas.width=texture.width;atlas.height=texture.height;
    let g=atlas.getContext('2d');g.drawImage(forceOpaque?opaqueTexture:texture,0,0);
  }
  // Mock content is routed per candidate batch, not into the shared atlas.
  // The 8-bit diagnostic is opaque-on-black: no runtime alpha claim is made.
  const mockScreens=new Map();
  if(useHud && hud.complete && hud.naturalWidth){for(const screen of viewOptions.mock_screens){let c=document.createElement('canvas');c.width=c.height=256;let g=c.getContext('2d');g.fillStyle='black';g.fillRect(0,0,256,256);let pad=256*screen.inset;g.drawImage(hud,...screen.source,pad,pad,256-2*pad,256-2*pad);mockScreens.set(screen.offset,{image:c,definition:screen})}}
  // Read only the small local preview atlas for hit testing. Painter order and
  // nearest-pixel alpha remain approximations of the game renderer.
  const pickCanvas=document.createElement('canvas');pickCanvas.width=atlas.width;pickCanvas.height=atlas.height;
  const pickContext=pickCanvas.getContext('2d');pickContext.drawImage(atlas,0,0);pickPixels=pickContext.getImageData(0,0,atlas.width,atlas.height);
  const ratio=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#242b31';ctx.fillRect(0,0,w,h);
  const eye=[target[0]+distance*Math.sin(yaw)*Math.cos(pitch),target[1]+distance*Math.sin(pitch),target[2]+distance*Math.cos(yaw)*Math.cos(pitch)];
  const forward=unit(sub(target,eye)),right=unit(cross(forward,[0,1,0])),up=cross(right,forward),f=Math.min(w,h)*0.95;
  const triangles=[];
  const box=viewOptions.bounds;
  for(const batch of model){if(hideNearby && useHud && (viewOptions.nearby_offsets||[]).includes(batch.off))continue;if(panelOnly && !batch.p.every(v=>v[0]>box[0] && v[0]<box[1] && v[1]>box[2] && v[1]<box[3] && v[2]>box[4] && v[2]<box[5]))continue;let p=batch.p.map(v=>{let d=sub(v,eye),z=dot(d,forward);return {x:w/2+dot(d,right)*f/z,y:h/2-dot(d,up)*f/z,z}});
    for(let i=0;i<p.length-2;i++){let ids=i%2?[i+1,i,i+2]:[i,i+1,i+2];let v=ids.map(j=>p[j]);if(v.some(q=>q.z<=0.1))continue;let uv=ids.map(j=>batch.uv[j]);triangles.push({v,uv,batch,z:(v[0].z+v[1].z+v[2].z)/3});}}
  triangles.sort((a,b)=>b.z-a.z);
  visibleTriangles=[];
  for(const t of triangles){let [a,b,c]=t.v,screen=mockScreens.get(t.batch.off),source=screen?screen.image:atlas,uvs=t.uv;
    if(screen){let [u0,v0,u1,v1]=screen.definition.uv;uvs=t.uv.map(p=>[(p[0]-u0)/(u1-u0),screen.definition.flip_v?1-(p[1]-v0)/(v1-v0):(p[1]-v0)/(v1-v0)])}
    let [u,v,q]=uvs;let u0=u[0]*source.width,v0=u[1]*source.height,u1=v[0]*source.width,v1=v[1]*source.height,u2=q[0]*source.width,v2=q[1]*source.height;
    let det=(u1-u0)*(v2-v0)-(u2-u0)*(v1-v0);if(Math.abs(det)<1e-8)continue;
    let A=((b.x-a.x)*(v2-v0)-(c.x-a.x)*(v1-v0))/det,C=((c.x-a.x)*(u1-u0)-(b.x-a.x)*(u2-u0))/det;
    let B=((b.y-a.y)*(v2-v0)-(c.y-a.y)*(v1-v0))/det,D=((c.y-a.y)*(u1-u0)-(b.y-a.y)*(u2-u0))/det;
    ctx.save();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.clip();ctx.transform(A,B,C,D,a.x-A*u0-C*v0,a.y-B*u0-D*v0);ctx.drawImage(source,0,0);ctx.restore();
    if(t.batch.off===selectedOffset){ctx.strokeStyle='#ffcc33';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.stroke()}
    t.pickOpaque=!!screen;visibleTriangles.push(t);}
  document.getElementById('status').textContent=`${triangles.length} provisional triangles (${panelOnly?'isolated panel region':'full model'}); ${useHud?'static per-batch mock, assignments unverified; ':''}${hideNearby&&useHud?'nearby source batches hidden experimentally; ':''}${forceOpaque?'opaque alpha diagnostic; ':''}centre is an inspection target, not the game's eye point.`;
  if(pendingPick){let values=pendingPick.split(',').map(Number);pendingPick=null;if(values.length===2 && values.every(Number.isFinite))inspectPoint(values[0],values[1])}
}
function hitUV(point,triangle){
  let [a,b,c]=triangle.v,den=(b.y-c.y)*(a.x-c.x)+(c.x-b.x)*(a.y-c.y);if(Math.abs(den)<1e-8)return null;
  let p=((b.y-c.y)*(point.x-c.x)+(c.x-b.x)*(point.y-c.y))/den,q=((c.y-a.y)*(point.x-c.x)+(a.x-c.x)*(point.y-c.y))/den,r=1-p-q;
  if(p<0||q<0||r<0)return null;let uv=triangle.uv;return [p*uv[0][0]+q*uv[1][0]+r*uv[2][0],p*uv[0][1]+q*uv[1][1]+r*uv[2][1]];
}
function alphaHit(uv){if(!pickPixels || uv[0]<0 || uv[0]>=1 || uv[1]<0 || uv[1]>=1)return false;let x=Math.floor(uv[0]*pickPixels.width),y=Math.floor(uv[1]*pickPixels.height);return pickPixels.data[(y*pickPixels.width+x)*4+3]>0}
function inspectPoint(x,y){
  let match=null;for(let i=visibleTriangles.length-1;i>=0;i--){let t=visibleTriangles[i],uv=hitUV({x,y},t);if(uv&&(t.pickOpaque||alphaHit(uv))){match=t.batch;break}}
  selectedOffset=match?match.off:null;
  if(match){let u=match.uv.map(v=>v[0]),v=match.uv.map(v=>v[1]);let xyz=[0,1,2].map(i=>match.p.map(p=>p[i]));let bounds=a=>`${Math.min(...a).toFixed(4)}..${Math.max(...a).toFixed(4)}`;
    document.getElementById('selection').textContent=`Candidate batch 0x${match.off.toString(16)}; UV ${bounds(u)}, ${bounds(v)}; position X ${bounds(xyz[0])}, Y ${bounds(xyz[1])}, Z ${bounds(xyz[2])}. Picking uses provisional painter order and nearest-pixel alpha.`;
  } else document.getElementById('selection').textContent='No candidate batch at this point.';
  render();
}
canvas.addEventListener('pointerdown',e=>{dragging=true;moved=false;startX=px=e.clientX;startY=py=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;if(Math.hypot(e.clientX-startX,e.clientY-startY)>4)moved=true;yaw-=(e.clientX-px)*0.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-py)*0.008));px=e.clientX;py=e.clientY;render()});
canvas.addEventListener('pointerup',e=>{dragging=false;if(!moved){let r=canvas.getBoundingClientRect();inspectPoint(e.clientX-r.left,e.clientY-r.top)}});
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(0.6,Math.min(30,distance*Math.exp(e.deltaY*0.001)));render()},{passive:false});
document.getElementById('front').onclick=()=>{yaw=Math.PI;pitch=0.15;distance=3;render()};
document.getElementById('down').onclick=()=>{yaw=Math.PI;pitch=0.7;distance=3;render()};
document.getElementById('toggle').onclick=e=>{panelOnly=!panelOnly;e.target.textContent=panelOnly?'Show full model':'Isolate panel';render()};
document.getElementById('hud').disabled=!hudUrl;
if(useHud) document.getElementById('hud').textContent='Show original atlas';
document.getElementById('hud').onclick=e=>{useHud=!useHud;e.target.textContent=useHud?'Show original atlas':'Show mock instruments';render()};
if(forceOpaque) document.getElementById('alpha').textContent='Use stored alpha';
document.getElementById('alpha').onclick=e=>{forceOpaque=!forceOpaque;e.target.textContent=forceOpaque?'Use stored alpha':'Show opaque atlas';render()};
document.getElementById('nearby').disabled=!hudUrl || !(viewOptions.nearby_offsets||[]).length;
if(hideNearby) document.getElementById('nearby').textContent='Show nearby geometry';
document.getElementById('nearby').onclick=e=>{hideNearby=!hideNearby;e.target.textContent=hideNearby?'Show nearby geometry':'Hide nearby geometry';render()};
window.addEventListener('resize',render);texture.onload=render;opaqueTexture.onload=render;hud.onload=render;
</script></body></html>
