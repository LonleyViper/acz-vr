[skip]
; 0 = you press Launch Game yourself (pick your input first); 1 = the mod clicks it
auto_launch=0
start=3
end=75
interval=1.0
hold=0.2
max_pulses=5
speed=8
speed_until=15
; Look-drive right-stick injection (DEFAULT OFF). 1 = XInputGetState(0) gets the acz-vr look-drive's right-stick offset added
; (only while fresh data arrives from acz-vr's xr_look_drive_xinput; stale/absent data and the look-drive.stop file = no change).
; Needs Player 1 = CONTROLLER in the launcher and a controller connected. Max in stick units, stale in milliseconds.
look_xinput=0
look_xinput_max=32767
look_xinput_stale_ms=150
; Fraction of full stick the game ignores on the right stick (measured ~0.19 in test 12). The injected offset is remapped past it so the
; look is proportional again; 0 = add the offset unchanged. Only used with look_xinput=1.
look_xinput_deadzone=0.19
; Look-stick gate (DEFAULT ON, D-355). While the acz-vr VR composite draws the in-flight world from the game camera (heartbeat from acz-vr,
; option lookstick:block inside xr_terrain_stage, the default), the game receives the RIGHT STICK centred, so the cockpit look-around cannot
; turn the whole VR world. Menus, flat play and buttons/triggers/left stick are unaffected; no heartbeat = the real stick passes through.
; 0 = never centre the right stick (the previous behaviour). stale_ms: heartbeat age after which the real stick passes again (100..2000).
xr_block_look_stick=1
xr_block_look_stick_stale_ms=500
